{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}Konto użytkownika{% endblock %}</h1>
{% endblock %}

{% block content %}

  <h2>Edytuj Profil</h2>
  <form method="post" action="{{ url_for('auth.update_username') }}">
    <fieldset>
        <legend>Zmień login</legend>
        <div class="form-group">
            <label for="username">Login:</label>
            <input name="username" id="username"
                   value="{{ request.form['username'] or user['username'] }}" required>
        </div>
        <div class="form-group">
            <button type="submit" class="btn btn-primary">Zapisz</button>
        </div>
    </fieldset>
  </form>

  <hr>

  <h2>Edytuj Opis</h2>
  <div id="bio-view">
    <label>Twój Opis:</label>
    <div class="terminal-card">
        <div class="card-body">
            <p class="bio-view-text">
                {{ user['bio'] or 'Nie masz jeszcze ustawionego opisu.' }}
            </p>
        </div>
    </div>
    <div style="margin-top: 1em;">
        <button type="button" class="btn" onclick="toggleEdit('bio-view', 'bio-edit')">
            <!-- Ikona Pencil -->
            <svg class="icon-btn" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
               <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125" />
            </svg>
            Edytuj Opis
        </button>
    </div>
  </div>

  <div id="bio-edit" style="display: none;">
    <form method="post" action="{{ url_for('auth.update_bio') }}">
        <fieldset>
            <legend>Edytuj Opis</legend>
            <div class="form-group">
                <label for="bio">Opis:</label>
                <textarea name="bio" id="bio" rows="5">{{ request.form['bio'] or user['bio'] or '' }}</textarea>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary">Zapisz</button>
                <button type="button" class="btn btn-default" onclick="toggleEdit('bio-view', 'bio-edit')">
                    Anuluj
                </button>
            </div>
        </fieldset>
    </form>
  </div>

  <hr>

  <form method="post" action="{{ url_for('auth.change_password') }}">
    <fieldset>
        <legend>Zmień hasło</legend>
        <div class="form-group">
            <label for="old_password">Stare hasło:</label>
            <input type="password" name="old_password" id="old_password" required>
        </div>
        <div class="form-group">
            <label for="new_password">Nowe hasło:</label>
            <input type="password" name="new_password" id="new_password" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">Potwierdź nowe hasło:</label>
            <input type="password" name="confirm_password" id="confirm_password" required>
        </div>
        <div class="form-group">
            <button type="submit" class="btn btn-primary">Zmień hasło</button>
        </div>
    </fieldset>
  </form>

{% endblock %}
